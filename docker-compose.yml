# samo-server. One command, nothing to edit:
#
#   docker compose -f oci://ghcr.io/bouliehaan/samo-server:compose up -d
#
# Point SAMO_MEDIA_DIR at your library if it is not /mnt/media; compose reads it
# from your shell, so there is still no file to edit:
#
#   SAMO_MEDIA_DIR=/srv/music docker compose -f oci://... up -d
#
# Everything else — libraries, admin account, integrations — is configured in
# the web UI at http://<this machine>:6969/setup.

services:
  db:
    image: postgres:16
    restart: unless-stopped
    # Socket only. `listen_addresses=` switches off the TCP listener entirely,
    # so the database is reachable through the shared socket volume below and
    # nowhere else — not from the LAN, not from another container, not from
    # another process on this host without access to that volume.
    #
    # That is also why there is no password: there is no network to
    # authenticate over, and a fixed default password baked into a published
    # compose artifact would be a worse answer than none. trust applies to
    # local socket connections only.
    command: ["postgres", "-c", "listen_addresses="]
    environment:
      POSTGRES_USER: samo
      POSTGRES_DB: samo
      POSTGRES_HOST_AUTH_METHOD: trust
    volumes:
      - pgdata:/var/lib/postgresql/data
      - pgsocket:/var/run/postgresql
    healthcheck:
      # The server waits for this, so it never races an unready database.
      test: ["CMD-SHELL", "pg_isready -U samo -d samo"]
      interval: 5s
      timeout: 5s
      retries: 12

  server:
    image: ghcr.io/bouliehaan/samo-server:latest
    restart: unless-stopped
    # Share the host's network stack: HTTP on :6969 and UDP autodiscovery on
    # :7360 bind to the host directly, so LAN broadcasts reach the server and it
    # advertises an address clients can actually use. Docker's default bridge
    # drops those broadcasts and would advertise a container-internal address.
    network_mode: host
    depends_on:
      db:
        condition: service_healthy
    environment:
      # Over the shared socket, not the network. Nothing here is a secret.
      SAMO_DB_DSN: postgres://samo@/samo?host=/var/run/postgresql
      SAMO_DATA_DIR: /data
      # Optional, and empty unless you export them. Passed through rather than
      # hardcoded so they can be set without a file:
      #   SAMO_LASTFM_API_KEY=... docker compose -f oci://... up -d
      SAMO_LASTFM_API_KEY: ${SAMO_LASTFM_API_KEY:-}
      SAMO_LASTFM_SHARED_SECRET: ${SAMO_LASTFM_SHARED_SECRET:-}
      SAMO_ACOUSTID_API_KEY: ${SAMO_ACOUSTID_API_KEY:-}
      SAMO_EGRESS_PROXY_URL: ${SAMO_EGRESS_PROXY_URL:-}
    healthcheck:
      # /health returns 503 when the database is unreachable, which catches a
      # server that is still running but can serve nothing — the failure mode
      # `restart: unless-stopped` never notices, because the process is alive.
      # start_period covers migrations on a cold first boot.
      test: ["CMD", "/usr/local/bin/samo-server", "healthcheck"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
    volumes:
      - pgsocket:/var/run/postgresql
      # samo's own state: extracted covers, podcast cache, radio config.
      - samodata:/data
      # Your media, mounted at the same path inside the container so the
      # absolute paths stored in the database keep resolving. Add libraries
      # pointing at it in the setup wizard.
      - ${SAMO_MEDIA_DIR:-/mnt/media}:${SAMO_MEDIA_DIR:-/mnt/media}:ro

volumes:
  pgdata:
  # The database socket, and the only channel between the two containers.
  pgsocket:
  samodata:
