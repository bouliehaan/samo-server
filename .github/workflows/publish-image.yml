# Publishes the container image people actually install from.
#
# Installing Samo Server means pulling an image and running compose. install.sh
# and the deploy scripts in this repo are maintainer tooling for our own boxes,
# not an install path for anyone else, so a release is not usable by anyone
# until the image below exists.
#
# Fires on a version tag. workflow_dispatch is there to (re)build an image for a
# tag that already exists, which is how v1.0.0 got its first image.
name: Publish container image

on:
    push:
        tags: ['v*']
    workflow_dispatch:
        inputs:
            ref:
                description: Tag to build an image for
                required: true
                default: v1.0.0

jobs:
    image:
        runs-on: ubuntu-latest
        permissions:
            contents: read
            packages: write

        steps:
            - name: Check out the tag being released
              uses: actions/checkout@v4
              with:
                  ref: ${{ github.event.inputs.ref || github.ref }}

            - name: Work out the version to tag the image with
              id: version
              run: echo "value=${{ github.event.inputs.ref || github.ref_name }}" >> "$GITHUB_OUTPUT"

            - uses: docker/setup-qemu-action@v3
            - uses: docker/setup-buildx-action@v3

            - name: Log in to ghcr.io
              uses: docker/login-action@v3
              with:
                  registry: ghcr.io
                  username: ${{ github.actor }}
                  password: ${{ secrets.GITHUB_TOKEN }}

            # The Dockerfile cross-compiles properly (BUILDPLATFORM on the node
            # and Go stages, TARGETOS/TARGETARCH passed to `go build`), so arm64
            # is a native-speed build rather than an emulated one.
            - name: Build and push
              uses: docker/build-push-action@v6
              with:
                  context: .
                  push: true
                  platforms: linux/amd64,linux/arm64
                  tags: |
                      ghcr.io/${{ github.repository }}:${{ steps.version.outputs.value }}
                      ghcr.io/${{ github.repository }}:latest
                  cache-from: type=gha
                  cache-to: type=gha,mode=max

            # The compose file is published to the same registry as the image,
            # as an OCI artifact. That is what makes the documented install one
            # command with no file to fetch or edit:
            #
            #   docker compose -f oci://ghcr.io/bouliehaan/samo-server:compose up -d
            #
            # --resolve-image-digests pins the image reference inside the
            # artifact to the digest built immediately above, so a given compose
            # tag always brings up exactly the image it was published with,
            # rather than whatever :latest happens to be later.
            # `docker compose publish` needs a recent Compose plugin, and the
            # runner image's is not guaranteed to be new enough. Install a
            # pinned one rather than hoping — a release that fails here has
            # already pushed the image, so the two halves would be out of step.
            - name: Install a Compose that can publish
              run: |
                  mkdir -p ~/.docker/cli-plugins
                  curl -fsSL -o ~/.docker/cli-plugins/docker-compose \
                      https://github.com/docker/compose/releases/download/v5.5.1/docker-compose-linux-x86_64
                  chmod +x ~/.docker/cli-plugins/docker-compose
                  docker compose version
                  docker compose publish --help >/dev/null

            - name: Publish the compose artifact
              env:
                  SAMO_MEDIA_DIR: /mnt/media
              run: |
                  docker compose -f docker-compose.yml publish --yes \
                      --resolve-image-digests \
                      "ghcr.io/${{ github.repository }}:compose-${{ steps.version.outputs.value }}"
                  docker compose -f docker-compose.yml publish --yes \
                      --resolve-image-digests \
                      "ghcr.io/${{ github.repository }}:compose"

            # A published artifact nobody can resolve is worse than none: the
            # documented install would fail on the very first command.
            - name: Check the published artifact resolves and is still configurable
              run: |
                  set -euo pipefail
                  ref="oci://ghcr.io/${{ github.repository }}:compose"

                  # It has to pull and parse, or the documented install fails on
                  # its very first command.
                  docker compose -f "$ref" config >/dev/null
                  echo "$ref resolves"

                  # And SAMO_MEDIA_DIR has to still be a variable in it. The
                  # README tells people to point it at their library on the
                  # install line; if publishing baked the default in, that would
                  # silently do nothing and everyone would mount /mnt/media.
                  if ! SAMO_MEDIA_DIR=/probe/media docker compose -f "$ref" config \
                        | grep -q '/probe/media'; then
                      echo "publish baked the media path in: SAMO_MEDIA_DIR no longer overrides it" >&2
                      echo "the README's install line would not work as documented" >&2
                      exit 1
                  fi
                  echo "SAMO_MEDIA_DIR still overrides"
